<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grupo — Votly</title>
    <link rel="stylesheet" href="/css/theme.css" />
  </head>
  <body>
    <div class="shell shell--wide">
      <div class="topbar">
        <a href="/groups.html" class="brand">VOT<span>LY</span></a>
        <div style="display: flex; gap: 0.5rem; align-items: center">
          <a href="/groups.html" class="btn btn--ghost" style="text-decoration: none">Grupos</a>
          <button type="button" class="btn btn--ghost" id="logout">Sair</button>
        </div>
      </div>
      <div id="err" class="error-banner" role="alert"></div>
      <p class="muted" id="breadcrumb"></p>
      <h1 id="title">Grupo</h1>
      <p class="muted" id="description"></p>

      <div class="split split--2">
        <div>
          <h2 class="section-title">Itens</h2>
          <div class="card" style="margin-bottom: 1rem">
            <form id="item-form">
              <div class="field">
                <label for="item-title">Novo item</label>
                <input id="item-title" maxlength="200" required placeholder="Título" />
              </div>
              <button type="submit" class="btn btn--primary">Adicionar</button>
            </form>
          </div>
          <ul id="items" class="list"></ul>
          <p id="items-empty" class="empty" style="display: none">Sem itens ainda.</p>

          <h2 class="section-title">Convidar membro</h2>
          <div class="card">
            <form id="invite-form">
              <div class="field">
                <label for="invite-email">Email</label>
                <input id="invite-email" type="email" required />
              </div>
              <button type="submit" class="btn btn--primary">Enviar convite</button>
            </form>
          </div>
        </div>
        <div>
          <h2 class="section-title">Ranking</h2>
          <div class="card">
            <ol id="ranking" class="list" style="padding-left: 1.2rem; margin: 0"></ol>
            <p id="rank-empty" class="empty" style="display: none">Sem votos ainda.</p>
          </div>
        </div>
      </div>
    </div>
    <script src="/js/app.js"></script>
    <script>
      (function () {
        if (!Votly.requireAuth()) return;
        var params = new URLSearchParams(window.location.search);
        var groupId = params.get('id');
        if (!groupId) {
          window.location.href = '/groups.html';
          return;
        }

        var err = document.getElementById('err');
        document.getElementById('logout').addEventListener('click', function () {
          Votly.logout();
        });

        function setHeader(group) {
          document.getElementById('title').textContent = group.name;
          var desc = document.getElementById('description');
          if (group.description) {
            desc.textContent = group.description;
            desc.style.display = 'block';
          } else {
            desc.style.display = 'none';
          }
          document.getElementById('breadcrumb').textContent =
            'Grupo · atualizado em ' + new Date(group.updatedAt).toLocaleString('pt-PT');
        }

        function loadGroupMeta() {
          return Votly.request('/groups').then(function (groups) {
            var g = groups.find(function (x) {
              return x.id === groupId;
            });
            if (!g) throw new Error('Grupo não encontrado');
            setHeader(g);
            return g;
          });
        }

        function renderItems(items) {
          var ul = document.getElementById('items');
          var empty = document.getElementById('items-empty');
          ul.innerHTML = '';
          if (!items || !items.length) {
            empty.style.display = 'block';
            return;
          }
          empty.style.display = 'none';
          items.forEach(function (it) {
            var li = document.createElement('li');
            var a = document.createElement('a');
            a.className = 'list-item';
            a.href =
              '/item.html?groupId=' +
              encodeURIComponent(groupId) +
              '&id=' +
              encodeURIComponent(it.id);
            var strong = document.createElement('strong');
            strong.textContent = it.title;
            a.appendChild(strong);
            li.appendChild(a);
            ul.appendChild(li);
          });
        }

        function renderRanking(rows) {
          var ol = document.getElementById('ranking');
          var empty = document.getElementById('rank-empty');
          ol.innerHTML = '';
          if (!rows || !rows.length) {
            empty.style.display = 'block';
            return;
          }
          empty.style.display = 'none';
          rows.forEach(function (r) {
            var li = document.createElement('li');
            li.style.marginBottom = '0.65rem';
            var span = document.createElement('span');
            span.className = 'rank-pill';
            span.textContent = '#' + r.rank;
            li.appendChild(span);
            var link = document.createElement('a');
            link.href =
              '/item.html?groupId=' +
              encodeURIComponent(groupId) +
              '&id=' +
              encodeURIComponent(r.itemId);
            link.textContent = r.title;
            link.style.color = 'inherit';
            li.appendChild(link);
            var sub = document.createElement('div');
            sub.className = 'muted';
            sub.style.fontSize = '0.85rem';
            sub.style.marginTop = '0.25rem';
            sub.textContent = r.voteSum + ' pts · ' + r.voteCount + ' votos';
            li.appendChild(sub);
            ol.appendChild(li);
          });
        }

        function refreshAll() {
          Votly.clearError(err);
          Promise.all([
            loadGroupMeta(),
            Votly.request('/items?groupId=' + encodeURIComponent(groupId)),
            Votly.request('/ranking?groupId=' + encodeURIComponent(groupId)),
          ])
            .then(function (parts) {
              renderItems(parts[1]);
              renderRanking(parts[2]);
            })
            .catch(function (e) {
              Votly.showError(err, e);
            });
        }

        document.getElementById('item-form').addEventListener('submit', function (e) {
          e.preventDefault();
          Votly.clearError(err);
          var title = document.getElementById('item-title').value.trim();
          Votly.request('/items', {
            method: 'POST',
            body: { groupId: groupId, title: title },
          })
            .then(function () {
              document.getElementById('item-title').value = '';
              refreshAll();
            })
            .catch(function (error) {
              Votly.showError(err, error);
            });
        });

        document.getElementById('invite-form').addEventListener('submit', function (e) {
          e.preventDefault();
          Votly.clearError(err);
          var email = document.getElementById('invite-email').value.trim();
          Votly.request('/groups/' + encodeURIComponent(groupId) + '/invite', {
            method: 'POST',
            body: { email: email },
          })
            .then(function () {
              document.getElementById('invite-email').value = '';
              alert('Convite enviado.');
            })
            .catch(function (error) {
              Votly.showError(err, error);
            });
        });

        refreshAll();
      })();
    </script>
  </body>
</html>
