<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registo — Votly</title>
    <link rel="stylesheet" href="/css/theme.css" />
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <a href="/login.html" class="brand">VOT<span>LY</span></a>
      </div>
      <div class="card">
        <h1>Criar conta</h1>
        <p class="muted">Mínimo 8 caracteres na palavra-passe.</p>
        <div id="err" class="error-banner" role="alert"></div>
        <form id="form">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="name">Nome (opcional)</label>
            <input id="name" name="name" type="text" autocomplete="name" />
          </div>
          <div class="field">
            <label for="password">Palavra-passe</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>
          <div class="btn-row">
            <button type="submit" class="btn btn--primary">Registar</button>
          </div>
        </form>
        <p class="muted" style="margin-top: 1.25rem">
          Já tens conta? <a href="/login.html">Entrar</a>
        </p>
      </div>
    </div>
    <script src="/js/app.js"></script>
    <script>
      (function () {
        if (Votly.getToken()) {
          window.location.href = '/groups.html';
          return;
        }
        var form = document.getElementById('form');
        var err = document.getElementById('err');
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          Votly.clearError(err);
          var body = {
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          };
          var name = document.getElementById('name').value.trim();
          if (name) body.name = name;
          Votly.request('/auth/signup', { method: 'POST', body: body })
            .then(function (data) {
              Votly.setToken(data.accessToken);
              window.location.href = '/groups.html';
            })
            .catch(function (error) {
              Votly.showError(err, error);
            });
        });
      })();
    </script>
  </body>
</html>
